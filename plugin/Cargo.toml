[package]
name = "vectorcraft-native-ai"
version = "0.4.5-beta.1"
edition = "2021"
license = "GPL-2.0-or-later"

[lib]
crate-type = ["cdylib"]

[dependencies]
kurbo = { version = "=0.13.0", default-features = false, features = ["std"] }
serde_json = "1.0"
base64 = "0.22"
image = { version = "=0.25.9", default-features = false, features = ["png", "jpeg", "webp"] }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
